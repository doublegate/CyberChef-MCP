# CyberChef MCP Server over Streamable HTTP.
#
#   docker compose -f deploy/compose/docker-compose.yml up
#
# Then point an MCP client at http://127.0.0.1:3000/mcp.
#
# For the ordinary local case -- one client, one machine -- you do not need this at all: run the
# server on stdio and let the client launch it (`npx cyberchef-mcp`). This file is for the case
# where the server is a shared service reached over HTTP.

services:
  cyberchef-mcp:
    image: ghcr.io/doublegate/cyberchef-mcp_v3:3.7.0
    # Pinned, not `latest`: a compose file that floats its tag cannot be rolled back to a known
    # state, and `latest` moves on every release.
    #
    # A VERSION TAG IS NOT A DIGEST. GHCR tags are mutable, so `3.6.0` is a promise about which
    # bytes were pushed rather than a guarantee about which bytes you get. For a deployment that
    # needs integrity, resolve the tag once and pin what it resolved to:
    #
    #     docker buildx imagetools inspect ghcr.io/doublegate/cyberchef-mcp_v3:3.7.0 \
    #       --format '{{.Manifest.Digest}}'
    #     # then: image: ghcr.io/doublegate/cyberchef-mcp_v3:3.7.0@sha256:<digest>
    #
    # The digest is deliberately not baked in here. It cannot be: this file ships in the commit
    # that CREATES the release, so at authoring time the image it names does not exist yet, and a
    # digest written from a prior build would pin the wrong bytes with more apparent authority
    # than the tag. Pinning is the operator's step, once, against the release they chose.
    # (`Dockerfile.mcp` does digest-pin its own base image, where the value IS knowable.)

    ports:
      # Bound to loopback on purpose. The MCP endpoint has NO authentication unless
      # CYBERCHEF_AUTH_ISSUER is set, so publishing it on 0.0.0.0 exposes 504 operations to
      # anything that can route to this host. Change the left-hand side deliberately, not by
      # copying an example.
      - "127.0.0.1:3000:3000"

    environment:
      CYBERCHEF_TRANSPORT: http
      # 0.0.0.0 INSIDE the container: the server defaults to loopback, which in a container means
      # "unreachable from the host". The published-port binding above is what actually limits
      # exposure.
      CYBERCHEF_HTTP_HOST: 0.0.0.0
      CYBERCHEF_HTTP_PORT: "3000"
      CYBERCHEF_LOG_LEVEL: info

      # Saved recipes live on the volume below. Comment both out and recipes are lost on restart,
      # which is fine if you do not use them.
      CYBERCHEF_RECIPE_STORAGE: /data/recipes.json

      # Graceful shutdown. Compose stops containers with SIGTERM and waits `stop_grace_period`.
      # There is no load balancer here, so the drain delay is short -- it exists for the
      # endpoint-propagation race in Kubernetes, which has no equivalent under compose.
      CYBERCHEF_DRAIN_DELAY_MS: "1000"
      CYBERCHEF_DRAIN_TIMEOUT_MS: "15000"

      # Authorization is OFF by default. To turn it on, set an issuer and the canonical resource
      # URI -- and read the note in the wiki first: CYBERCHEF_AUTH_RESOURCE is what the token's
      # audience is checked against (RFC 8707), so a mismatch rejects every otherwise-valid token
      # and looks exactly like "authentication is broken".
      # CYBERCHEF_AUTH_ISSUER: https://auth.example.com
      # CYBERCHEF_AUTH_RESOURCE: https://mcp.example.com/mcp

    volumes:
      - recipes:/data
      # The image runs with a read-only root filesystem in Kubernetes; under compose the same
      # hygiene costs nothing.
      - type: tmpfs
        target: /tmp

    # Must exceed drain delay + drain timeout, or the container is SIGKILLed partway through its
    # own shutdown and in-flight requests are dropped.
    stop_grace_period: 20s

    healthcheck:
      # Readiness, not liveness: compose has one notion of health, and "should this receive
      # traffic" is the more useful of the two here. It goes unhealthy during a drain, which is
      # correct -- the container is stopping.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      # Cold start is ~185 ms, so this is generous; it costs nothing when startup is fast.
      start_period: 10s
      retries: 3

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          # The Node API loads every operation implementation on first use of cyberchef_search or
          # a saved recipe. A limit below ~512Mi will OOM there rather than at startup, which is a
          # confusing place to discover it.
          memory: 1G
        reservations:
          memory: 256M

volumes:
  recipes:
