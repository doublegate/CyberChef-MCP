{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyberchef-mcp.serviceAccountName" . }}
  labels:
    {{- include "cyberchef-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server calls no Kubernetes API, so its token buys an attacker nothing here.
automountServiceAccountToken: false
{{- end }}
