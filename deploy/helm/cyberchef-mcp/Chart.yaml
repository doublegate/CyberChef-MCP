apiVersion: v2
name: cyberchef-mcp
description: CyberChef MCP Server - 504 data-transformation operations as MCP tools, over Streamable HTTP
type: application
# The chart's own version, bumped when the CHART changes -- not when the application does. That is
# `appVersion` below, and the two move independently on purpose.
#
# WHY THIS IS NOT BUMPED EVERY RELEASE, since a reviewer has now raised it twice. This chart is not
# published: `helm-chart.yml` lints and renders it, and there is no `helm push`, no `helm package`,
# no chart-releaser, no OCI push and no `index.yaml` anywhere in this repository. It is consumed
# from a checked-out ref, where `appVersion` and `values.yaml` are simply whatever that ref contains.
# `scripts/bump-version.mjs` says so on every run ("NOT touched: the chart's own version") and
# `check:versions` reports it as "not checked, moves with the templates".
#
# THE CONDITION THAT WOULD CHANGE THIS, recorded here so it is met at the file rather than in a
# review thread: **the day this chart is published to a chart repository or an OCI registry, it must
# be bumped on any release that changes packaged content** -- and that includes `values.yaml`, whose
# `image.tag` moves every release even though no template does. Two different packages sharing a
# version number is a real problem for a repository consumer; it is a non-problem for a git
# consumer, which is the only kind this chart currently has.
version: 0.5.8
# The application version this chart defaults to. Kept in step with the image tag in values.yaml.
appVersion: "4.0.0"
# Derived from the project's round-patch artwork: cropped to the patch, contrast-lifted and
# reduced to 256px/128 colours, because the source is a 973 KB photograph of embroidery that
# renders as a dark grey disc at the ~48px an Artifact Hub listing actually shows.
icon: https://raw.githubusercontent.com/doublegate/CyberChef-MCP/master/images/icon.png
home: https://github.com/doublegate/CyberChef-MCP
sources:
  - https://github.com/doublegate/CyberChef-MCP
keywords:
  - mcp
  - model-context-protocol
  - cyberchef
  - security
maintainers:
  - name: doublegate
    url: https://github.com/doublegate
