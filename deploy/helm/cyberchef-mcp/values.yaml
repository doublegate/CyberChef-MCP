# Default values for cyberchef-mcp.
#
# The defaults are chosen to be CORRECT rather than impressive: one replica, authorization off,
# no ingress. Each of those is a deliberate decision explained where it appears, and every one of
# them has a documented way to change it.

replicaCount: 1
# WHY ONE, and what to do before raising it.
#
# The server itself is stateless per request -- MCP protocol revision 2026-07-28 removed
# protocol-level sessions entirely, so there is nothing to make sticky and no session store to
# run. Two things are still per-process:
#
#   - RECIPE STORAGE is a JSON file. Two replicas sharing one file will conflict; the server
#     detects a stale write and refuses it rather than silently discarding the other replica's
#     recipes, but a refused save is still a failed save. Give each replica its own volume
#     (persistence.perReplica below), or accept that saved recipes are per-pod.
#   - THE OPERATION CACHE is per-process, which is fine: it is a cache, and each replica warms
#     its own.
#
# So: raise replicaCount freely if you do not use saved recipes, and read persistence first if
# you do.

image:
  repository: ghcr.io/doublegate/cyberchef-mcp_v3
  pullPolicy: IfNotPresent
  # Pinned rather than "latest". A chart that floats its tag cannot be rolled back to a known
  # state, and `latest` moves on every release.
  tag: "3.3.0"
  # A TAG IS NOT A DIGEST. GHCR tags are mutable, so the line above is a promise about which bytes
  # were pushed, not a guarantee about which bytes you get. Set this and it wins over `tag`:
  #
  #   docker buildx imagetools inspect ghcr.io/doublegate/cyberchef-mcp_v3:3.3.0 \
  #     --format '{{.Manifest.Digest}}'
  #   digest: "sha256:..."
  #
  # Empty by default, and it has to be: this chart ships in the commit that CREATES the release,
  # so at authoring time the image it names does not exist yet. A digest carried over from a prior
  # build would pin the WRONG bytes with more apparent authority than the tag. Pinning is the
  # operator's step, once, against the release they chose -- the same reasoning the compose file
  # records, now with a supported field instead of an instruction to edit the template.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 3000

# The MCP endpoint path. Must match CYBERCHEF_MCP_PATH if you override that.
mcpPath: /mcp

ingress:
  enabled: false
  className: ""
  annotations: {}
    # SSE responses must not be buffered by the proxy, or streamed progress arrives all at once
    # when the request finishes. For ingress-nginx:
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: cyberchef-mcp.example.com
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []

resources:
  requests:
    # The server loads 505 operation implementations on first use of the Node API. Measured
    # resident set after that load is well under 512Mi, but a limit below it will OOM on the
    # first cyberchef_search rather than at startup, which is a confusing place to find out.
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: "1"

autoscaling:
  # Off by default, and read replicaCount's note before turning it on: autoscaling multiplies
  # replicas, so it inherits the recipe-storage constraint.
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  # Only meaningful with more than one replica; a PDB with minAvailable 1 over a single replica
  # blocks node drains entirely.
  enabled: false
  minAvailable: 1

# Probe configuration.
#
# The three probes are NOT interchangeable, and the server treats them differently on purpose:
#
#   startup   - passes once the listener is bound. Holds the other two off during boot.
#   readiness - fails while draining, which is what makes a rolling update lose no requests.
#   liveness  - stays healthy while draining. A liveness failure during a drain gets the pod
#               KILLED mid-drain, which is the opposite of what the drain is for.
probes:
  startup:
    # failureThreshold x periodSeconds is the boot budget. Cold start is ~185 ms, so this is
    # generous by two orders of magnitude and costs nothing when boot is fast.
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  liveness:
    periodSeconds: 10
    timeoutSeconds: 5
    # Deliberately tolerant. Liveness restarts the pod, so a twitchy threshold turns a slow
    # moment into a restart loop.
    failureThreshold: 6

# Graceful shutdown.
#
# Kubernetes sends SIGTERM and removes the pod from Service endpoints AT THE SAME TIME, and
# endpoint removal takes time to propagate through kube-proxy and any ingress. Both halves below
# address that race from opposite ends:
#
#   preStopSleepSeconds - delays SIGTERM so endpoint removal can propagate first
#   drain.delaySeconds  - after SIGTERM, keeps serving while readiness reports failure
#
# Either alone narrows the window; both together close it.
#
# terminationGracePeriodSeconds MUST exceed preStop + drain delay + drain timeout, or the kubelet
# SIGKILLs the process partway through its own shutdown.
preStopSleepSeconds: 5
drain:
  delaySeconds: 5
  timeoutSeconds: 20
terminationGracePeriodSeconds: 45

# The server configuration file, rendered into a ConfigMap and mounted at
# /app/cyberchef.config.json. Empty means no file, and the server behaves exactly as it did
# before v2.10.0 -- everything through environment variables.
#
# Sections and settings: docs/guides/configuration.md. An unknown section or setting STOPS the
# server with a message naming it, which is the reason to prefer this over a pile of extraEnv
# strings: a misspelt environment variable is silently ignored, and a misspelt key here is not.
#
# NOTE ON PRECEDENCE. Environment beats file, and this chart sets CYBERCHEF_TRANSPORT,
# CYBERCHEF_HTTP_HOST, CYBERCHEF_HTTP_PORT and CYBERCHEF_HTTP_PATH itself because the pod cannot
# serve without them. Putting server.transport or http.port here will NOT take effect; the startup
# log names every setting the environment overrode. Use service.port and the chart values instead.
#
# Changing this rolls the pods: the file is read once at startup, so a checksum annotation forces
# a restart rather than letting a successful helm upgrade leave the old settings running.
#
# config:
#   security:
#     offline: true
#     maxRegexLength: 500
#   tools:
#     surface: curated
#   cache:
#     maxSize: 52428800
config: {}

persistence:
  # Saved recipes. Off by default: with no volume, recipes live in the container filesystem and
  # are lost on restart, which is the right default for a stateless deployment that does not use
  # them.
  enabled: false
  # perReplica uses a StatefulSet-style volumeClaimTemplate so each replica gets its OWN volume.
  # That is the supported way to run multiple replicas with saved recipes: they do not share, so
  # they cannot conflict -- at the cost of recipes being visible only on the pod that saved them.
  #
  # Setting this false with replicaCount > 1 shares one ReadWriteMany volume between replicas,
  # which the server will detect and refuse writes on. Do not do it.
  perReplica: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# Authorization (v2.5.0). Off unless issuer is set.
#
# Secrets are referenced, never inlined: putting an issuer's client secret in values.yaml puts it
# in `helm get values` output and in whatever repository the values file lives in.
auth:
  enabled: false
  issuer: ""
  resource: ""
  audience: ""
  requiredScopes: ""
  # Name of an existing Secret whose keys are added as environment variables.
  existingSecret: ""

# Multi-tenancy (v2.5.0). Requires auth.enabled; the server refuses to start otherwise.
tenancy:
  enabled: false
  claim: tid

# Tool surface. "index" exposes the navigation tools only and is the smallest context cost;
# "curated" and "all" expose progressively more. Nothing becomes unreachable in any mode --
# cyberchef_bake runs any operation by name.
toolSurface: ""

logLevel: info

# Prometheus metrics (v2.7.0).
#
# OFF BY DEFAULT, and that is a security decision rather than caution about cost.
#
# The health probes are unauthenticated and always on, because a kubelet probe carries no bearer
# token and a probe answers "should I get traffic" in one word. /metrics is unauthenticated for the
# same reason -- a Prometheus scraper carries no token either -- but it says considerably more:
# which tools are being used, how often, how large the inputs are, how many tenants are active.
# That is a useful reconnaissance surface, so it is opt-in and belongs on an internal network or
# behind a NetworkPolicy.
#
# What it never exposes: tenant identifiers, tool arguments, subject digests, recipe names, error
# messages. Tenant COUNT yes; tenant NAMES no.
metrics:
  enabled: false

# How Prometheus finds the endpoint above. Both paths are guarded on metrics.enabled: pointing a
# scraper at a /metrics that 404s produces a permanently-down target, which is worse than no target
# because it looks like an outage and gets chased as one.
monitoring:
  serviceMonitor:
    # Needs the Prometheus Operator CRDs. The template fails rendering with an explanation if the
    # monitoring.coreos.com/v1 API is absent, rather than applying an object the cluster drops.
    enabled: false
    # Empty means the release namespace. Set it if your Prometheus only watches one namespace.
    namespace: ""
    # Most Prometheus Operator installs select ServiceMonitors by a label; without the right one
    # here the object is created and then silently ignored. Check your Prometheus CR's
    # serviceMonitorSelector before assuming the default works.
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    # Ships the 9 alerting rules from deploy/grafana/alerts.yaml as a PrometheusRule.
    enabled: false
    additionalLabels: {}
  # Classic prometheus.io/scrape pod annotations, for clusters WITHOUT the Prometheus Operator.
  # Use one or the other; both at once means two scrapes of the same target.
  podAnnotations: false

# Extra environment variables, for anything not modelled above.
extraEnv: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Pod-level security context. The image already runs as UID 65532 (Chainguard nonroot); these
# are stated explicitly so a cluster policy engine can see them rather than infer them.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
