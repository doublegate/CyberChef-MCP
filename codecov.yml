# Codecov Configuration
# Comprehensive setup for Coverage Analytics, Bundle Analysis, and Test Analytics
# Documentation: https://docs.codecov.com/docs/codecovyml-reference

# Coverage Analytics Configuration
coverage:
  # Coverage precision and display settings
  precision: 2
  round: down
  range: 90..97  # Red below 90%, yellow 90-97%, green above 97%. Raised in v2.3.0
                 # alongside the vitest thresholds; the old 70..90 painted a 94%
                 # project solid green with nothing left to aim at.

  # Coverage status checks
  status:
    # Overall project coverage
    project:
      default:
        # Was 70%, i.e. more than twenty points below actual: the check could not fail, which
        # is the same as not having one. Kept just under the vitest gate so the two agree.
        target: 95%
        threshold: 1%            # Allow 1% decrease without failing
        base: auto
        if_ci_failed: error

    # Coverage on changed files only (patch coverage)
    patch:
      default:
        # New code arrives covered. Patch is the only check that sees an addition on its own --
        # the project figure moves slowly and forgives one -- so this is deliberately the most
        # demanding number here, well above the project target.
        #
        # 90% rather than 100%, and the number was measured rather than chosen. 100% was tried
        # first, on this release's own PR, and came out at 93%. The residual was not laziness: it
        # is SDK `onerror` callbacks, `closeAll` teardown-failure branches, and `stat` errors other
        # than ENOENT -- reachable only by faking a filesystem or SDK failure, which asserts that
        # the mocks were called rather than that the code works. Everything reachable was covered
        # instead, which is what a firing gate is *for*; four real cases came out of it (an invalid
        # port, the connection cap, a forged Host, a missing Host).
        #
        # A target nobody can hit is a check people learn to override, which is the same failure
        # as a check that cannot fail -- the one this file had at 75%.
        target: 90%
        threshold: 0%
        base: auto
        if_ci_failed: error

  # Path exclusions - files not counted in coverage
  ignore:
    - "node_modules/**"
    - "build/**"
    - "dist/**"
    - "tests/**"
    - "benchmarks/**"
    - "scripts/**"
    - "src/web/**"                # Web UI (not part of MCP server)
    - "src/core/vendor/**"        # Third-party vendor code
    - "src/core/operations/legacy/**"  # Legacy operations
    - "**/*.test.mjs"
    - "**/*.config.js"
    - "**/*.config.mjs"
    - "Gruntfile.js"
    - "webpack.config.js"
    - "nightwatch.conf.js"
    - "**/consumers/**"           # Test consumers

# Pull Request Comments
comment:
  layout: "header, diff, flags, components, footer"
  behavior: default             # Post comment on every PR
  require_changes: false        # Always post, even if no coverage change
  require_base: false           # Post even if base branch has no coverage
  require_head: true            # Require head coverage to post

# Flags for different test types
# Allows tracking coverage from different test suites separately
flags:
  # The MCP server is every fork-owned module under src/node/, not just the entry point and lib/.
  # The old two-path list silently omitted errors, logger, streaming, retry, transports,
  # deprecation, worker-pool, worker and the three recipe-* modules -- twelve of our own files
  # absent from flag-based reporting while appearing in the totals.
  mcp-tests:
    paths:
      - src/node/**
      - "!src/node/index.mjs"       # generated by grunt
      - "!src/node/api.mjs"         # upstream-owned
      - "!src/node/apiUtils.mjs"
      - "!src/node/File.mjs"
      - "!src/node/NodeDish.mjs"
      - "!src/node/NodeRecipe.mjs"
      - "!src/node/repl.mjs"
    carryforward: true          # Use previous coverage if not uploaded

# Component-level coverage tracking
component_management:
  individual_components:
    # MCP Server component
    - component_id: mcp-server
      name: "MCP Server"
      paths:
        - src/node/mcp-server.mjs
        - src/node/lib/**
        - src/node/errors.mjs
        - src/node/logger.mjs
        - src/node/streaming.mjs
        - src/node/retry.mjs
        - src/node/transports.mjs
        - src/node/deprecation.mjs
        - src/node/worker-pool.mjs
        - src/node/worker.mjs
        - src/node/recipe-manager.mjs
        - src/node/recipe-storage.mjs
        - src/node/recipe-validator.mjs

    # Core Operations component
    - component_id: core-operations
      name: "Core Operations"
      paths:
        - src/core/operations/**
        - "!src/core/operations/legacy/**"

    # Node API component
    - component_id: node-api
      name: "Node.js API"
      paths:
        - src/node/index.mjs
        - src/node/wrapper.js
        - src/node/config/**

# GitHub Checks configuration
github_checks:
  annotations: true             # Show line-by-line annotations on PRs

# Codecov UI Settings (deprecated, removed in newer versions)
# ui:
#   hide_density: false           # Show coverage density in UI
#   hide_complexity: false        # Show cyclomatic complexity

# Slack notifications (disabled by default)
slack_app: false

# `profiling.critical_files_paths` was removed here in v2.3.0: it configures a Codecov feature
# that no longer exists, so it was inert configuration describing a capability the project did not
# have -- the same shape of claim this release spent its time removing from the code.
