# CodeRabbit configuration for CyberChef-MCP.
# https://docs.coderabbit.ai/reference/configuration
#
# Alongside copilot-pull-request-reviewer and the self-hosted Antigravity `agy`
# reviewer. Project convention: reply to AND resolve every bot review thread
# before merge, whatever the verdict.
#
# THE LOAD-BEARING SETTING HERE IS `base_branches`. Without it CodeRabbit reviews
# only PRs targeting the default branch, and reported
# "Review skipped: reviews are disabled for this base branch" on PR #41. The whole
# v2.0.0 release train targets a long-lived `release/v2.0.0` integration branch,
# so every PR in it would have gone unreviewed.
#
# profile: assertive — deliberately more thorough than the "chill" default. This
# is a security/cryptography toolkit where a silently wrong decode or cipher
# result is worse than a crash, so extra nitpicks are worth not missing the one
# comment that matters.

# en-US is this project's convention. Note .cspell.json (upstream's file) declares
# "en,en-gb", which loads BOTH dictionaries - so American spellings pass the grammar
# check and upstream's British prose in src/core does too. Nothing conflicts.
language: en-US

tone_instructions: >-
  Precise, technical language. No emojis or poems. Prioritize correctness of
  cryptographic and data-transformation output, and fork hygiene, over style nits
  that ESLint already catches in CI.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  slop_detection:
    enabled: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
    # Without these, only PRs into the default branch are reviewed.
    base_branches:
      - "master"
      - "release/.*"
      - "v1\\.9\\.x"
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    autofix:
      enabled: true
    simplify:
      enabled: false

  pre_merge_checks:
    title:
      mode: warning
    description:
      mode: warning
    issue_assessment:
      mode: warning
    docstrings:
      mode: warning
      threshold: 80
    custom_checks:
      - name: "No hand-edits to synced upstream code"
        mode: warning
        instructions: >
          Files under src/core/** are synced verbatim from gchq/CyberChef by
          .github/workflows/upstream-sync.yml. A hand-edit there is silently
          reverted on the next sync and permanently forks this repo from
          upstream. Flag any change to src/core/** that is not part of an
          upstream sync PR. Fixes belong upstream, or in the MCP layer under
          src/node/. Pass if the PR title or body identifies it as an upstream
          sync.
      - name: "No edits to generated files"
        mode: warning
        instructions: >
          src/core/config/OperationConfig.json, src/core/operations/index.mjs and
          tests/operations/index.mjs are generated by `npx grunt configTests` and
          are gitignored. Flag any PR that adds or edits them directly.
      - name: "Async bake call sites"
        mode: warning
        instructions: >
          bake() and NodeRecipe.execute() are async as of upstream v11.0.0. Flag
          any call site that uses the return value synchronously, or that calls
          .then() on it without awaiting, or that assumes bake throws
          synchronously rather than rejecting.
      - name: "Per-session MCP HTTP transport"
        mode: warning
        instructions: >
          The Streamable HTTP transport must construct one Server +
          StreamableHTTPServerTransport pair per session ID. Sharing a single
          instance across clients leaks cross-client response data
          (GHSA-345p-7cg4-v4c7) and causes "Server already initialized"
          (issue #36). Flag any reintroduction of a shared instance.
      - name: "Deprecation entry for breaking MCP changes"
        mode: warning
        instructions: >
          If this PR changes a public MCP tool name, argument shape, or recipe
          format, there must be a corresponding entry in src/node/deprecation.mjs
          and a CHANGELOG.md note. Pass for internal refactors and additive
          changes.
      - name: "CHANGELOG entry for user-visible changes"
        mode: warning
        instructions: >
          If this PR changes user-visible behaviour, adds a feature, or fixes a
          user-facing bug, CHANGELOG.md should gain an entry under [Unreleased].
          Pass for pure-internal refactors, dependency-only bumps with no
          behaviour change, or CI/tooling-only changes.

  path_filters:
    # Reference corpus of external tools; large, vendored, and not our code.
    - "!ref-proj/**"
    - "!package-lock.json"
    - "!src/core/config/OperationConfig.json"
    - "!src/core/operations/index.mjs"
    - "!tests/operations/index.mjs"
    - "!src/core/vendor/**"

  path_instructions:
    - path: "src/node/mcp-server.mjs"
      instructions: >
        The MCP server entry point: protocol handling, dynamic tool generation
        from OperationConfig, and call dispatch. Tool names are derived by
        sanitizeToolName() from operation display names. Flag anything that
        could change a public tool name or argument schema without a
        deprecation entry, and anything that bypasses the timeout/retry wrapper
        in retry.mjs or the worker-pool routing in worker-pool.mjs.
    - path: "src/node/transports.mjs"
      instructions: >
        stdio and Streamable HTTP transport construction. The HTTP branch must
        keep per-session Server/transport isolation; see the pre-merge check.
    - path: "src/node/deprecation.mjs"
      instructions: >
        DEP001-DEP008 are the published v2.0.0 breaking-change contract, mirrored
        in docs/v2.0.0-breaking-changes.md. Flag any change to a code's meaning
        or removalVersion that is not reflected in that document.
    - path: "src/core/**"
      instructions: >
        Synced verbatim from upstream gchq/CyberChef. Do not suggest style,
        naming, spelling or refactoring changes here; they would be reverted by the
        next sync. In particular this project is en-US but GCHQ writes British
        English, so British spellings in these files are correct and must not be
        flagged. Only comment if the change itself looks wrong for the sync.
    - path: ".github/workflows/**"
      instructions: >
        Self-hosted runners are used for the `agy` review job, so a workflow that
        executes PR-supplied code is a real escalation risk. Flag untrusted
        github.event.* data interpolated into run: blocks, use of
        pull_request_target with a PR checkout, and any checkout of PR head code
        that is subsequently executed.
    - path: "tests/mcp/**"
      instructions: >
        Vitest suite for the MCP layer, gated at 75% lines/statements, 90%
        functions, 70% branches. Flag behaviour changes that arrive without
        matching tests.
