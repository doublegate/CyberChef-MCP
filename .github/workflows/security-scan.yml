# =============================================================================
# Security Scan Workflow - CyberChef MCP Server
# =============================================================================
# Automated security scanning using Trivy for container vulnerabilities.
# Uploads results to GitHub Security tab via SARIF format.
#
# Triggers:
# - Push to master branch
# - Pull requests to master
# - Weekly scheduled scan (Sundays at midnight UTC)
# - Manual trigger via workflow_dispatch
# =============================================================================

name: Security Scan

on:
  push:
    branches: [master, 'release/**']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.mcp'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [master, 'release/**']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.mcp'
      - '.github/workflows/security-scan.yml'
  schedule:
    # Weekly scan every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to report (CRITICAL, HIGH, MEDIUM, LOW)'
        required: false
        default: 'HIGH'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

env:
  # Use environment variables for any dynamic values
  DEFAULT_SEVERITY: 'CRITICAL,HIGH'

jobs:
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Configure git
        run: git config --global init.defaultBranch master

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          tags: cyberchef-mcp:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine severity level
        id: severity
        env:
          INPUT_SEVERITY: ${{ inputs.severity }}
        run: |
          if [ -n "$INPUT_SEVERITY" ]; then
            echo "level=$INPUT_SEVERITY" >> "$GITHUB_OUTPUT"
          else
            echo "level=CRITICAL,HIGH" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cyberchef-mcp:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ steps.severity.outputs.level }}
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'
          timeout: '10m'
          # Stated explicitly rather than relying on trivy's cwd default, so that a change to the
          # working directory cannot silently un-suppress a documented, justified finding -- or,
          # worse, silently suppress nothing while the file suggests otherwise.
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-scan'

      # PR gate, now at the SAME severity as the SARIF report above.
      #
      # It was pinned to CRITICAL with a `TODO(PR 7): restore ... once the backlog is zero`, whose
      # stated reason was "a 272-finding backlog" that would have failed every PR in the v2.0.0
      # series. The backlog reached zero in v2.1.1 and has stayed there; the narrowed gate outlived
      # its cause by eight releases.
      #
      # A gate quieter than its own report is the shape worth avoiding: the Security tab showed
      # CRITICAL+HIGH the whole time, so nothing was hidden -- but a HIGH could merge while the
      # dashboard listed it, and the difference between "reported" and "gated" is the only part
      # that changes what ships. Measured 0 CRITICAL / 0 HIGH on the published v3.1.0 image before
      # restoring this.
      - name: Run Trivy in table format for logs
        uses: aquasecurity/trivy-action@v0.36.0
        if: github.event_name == 'pull_request'
        with:
          image-ref: 'cyberchef-mcp:scan'
          format: 'table'
          severity: ${{ steps.severity.outputs.level }}
          vuln-type: 'os,library'
          exit-code: '1'
          # Same ignore file as the SARIF steps. It changes nothing today -- the only entry is a
          # LOW and this step filters to CRITICAL -- but a gate and a report that disagree about
          # what is suppressed is a trap for whoever reads them next, and the mismatch would appear
          # silently the first time a CRITICAL is ever justified here.
          trivyignores: '.trivyignore'

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Configure git
        run: git config --global init.defaultBranch master

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Run npm audit
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-results.json 2>&1 || true

      - name: Determine severity level
        id: severity
        env:
          INPUT_SEVERITY: ${{ inputs.severity }}
        run: |
          if [ -n "$INPUT_SEVERITY" ]; then
            echo "level=$INPUT_SEVERITY" >> "$GITHUB_OUTPUT"
          else
            echo "level=CRITICAL,HIGH" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: ${{ steps.severity.outputs.level }}
          vuln-type: 'library'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-dependency-scan'

      # =============================================================================
      # Infrastructure-as-code: the Helm chart, Compose file and Dockerfile
      # =============================================================================
      # Added in v2.8.0, and the reason is worth recording.
      #
      # Until v2.8.0 the Helm chart was scanned BY ACCIDENT: `deploy/` was being copied into the
      # runtime image, so the container scan reached it at `/app/deploy/...` and reported against
      # it. v2.8.0 stopped shipping non-runtime trees in the image -- a real size fix that would
      # have silently ENDED the chart's scanning as a side effect, and closed two open alerts by
      # moving the file rather than by addressing them.
      #
      # A finding that disappears because the file moved is not a finding that was addressed. So
      # the IaC is now scanned where it lives, on purpose, with its standing findings configured in
      # security/trivy/ rather than left to vanish.
      - name: Run Trivy IaC scan (Helm, Compose, Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'
          severity: ${{ steps.severity.outputs.level }}
          # Check parameters -- notably the KSV-0125 trusted-registry list, which names the
          # registries this project publishes to rather than suppressing the check.
          trivy-config: 'security/trivy/trivy.yaml'
          trivyignores: 'security/trivy/.trivyignore.yaml'

      - name: Upload IaC scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'trivy-iac-scan'

      - name: Upload npm audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure git
        run: git config --global init.defaultBranch master

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          tags: cyberchef-mcp:sbom
          load: true

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cyberchef-mcp:sbom'
          format: 'cyclonedx'
          output: 'sbom.cyclonedx.json'
          vuln-type: 'os,library'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90
