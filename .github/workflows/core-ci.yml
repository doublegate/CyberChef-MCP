name: "MCP Server CI"

on:
  workflow_dispatch:
  push:
    branches:
    - master
    # The release train is long-lived: without this it accumulates dozens of
    # commits with no CI at all, and a master->release merge is validated by nothing.
    - 'release/**'
    # These must include everything the gate's RESULT depends on, not just the product code.
    # `tests/**` and `vitest.config.mjs` were missing, so a test-only commit could not trigger the
    # job -- which meant the commit that FIXED the coverage thresholds was unable to demonstrate it,
    # and, worse, a change that broke a test while touching nothing else would sail through.
    paths:
      - 'src/core/**'
      - 'src/node/**'
      - 'tests/**'
      - 'vitest.config.mjs'
      - 'Gruntfile.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest

    # BOTH ENDS OF THE SUPPORTED RANGE.
    #
    # `package.json` declares `engines: >=24 <27`, and until now every workflow tested 24 while the
    # published image ran **26.8.1**. So the runtime that actually ships was never tested, and the
    # floor was the only thing that was -- a gap that a green pipeline hid completely.
    #
    # Bumping everything to 26 would have inverted the bug rather than fixed it: 24 is a supported
    # version for anyone installing from npm, and an untested floor is exactly what this was.
    # Testing both boundaries is the only claim the manifest can honestly make.
    #
    # `fail-fast: false` so a failure on one version still reports the other -- when a Node version
    # is the variable under test, "which ones broke" is the entire result.
    strategy:
      fail-fast: false
      matrix:
        # 24 = the declared floor. 26 = what Dockerfile.mcp actually runs.
        node-version: ['24', '26']

    name: test (node ${{ matrix.node-version }})
    steps:
    - name: Configure git
      run: git config --global init.defaultBranch master

    - uses: actions/checkout@v7

    - name: Set node version
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install
      run: |
        npm install
        npm run setheapsize

    - name: Update browserslist database
      run: npx update-browserslist-db@latest

    # Patch node_modules for the removed `SlowBuffer`, as the other suites do.
    #
    # NOT "Node 22 compatibility", which is what this said and what it never was: SlowBuffer was
    # REMOVED from Node, so the patch is needed on every version this project supports and will
    # be needed on later ones too. Naming a version here implied the opposite -- that moving off
    # 22 would retire it -- which is exactly the wrong thing to believe while debugging.
    # because npm install might overwrite them or they might not be patched in the repo
    - name: Patch Dependencies (SlowBuffer)
      run: |
        sed -i 's/new SlowBuffer/Buffer.alloc/g' node_modules/avsc/lib/types.js
        sed -i 's/SlowBuffer/Buffer/g' node_modules/buffer-equal-constant-time/index.js

    - name: Lint
      run: npx grunt lint

    # A prose checklist could not fail a build, and did not: v2.9.0 shipped with the Helm chart and
    # the compose file still pointing at 2.8.1, which is the third consecutive release to get this
    # wrong while AGENTS.md told the author not to.
    - name: Version consistency
      run: npm run check:versions

    - name: Config Tests (Generate Configs)
      run: npx grunt configTests

    - name: Unit Tests
      run: |
        npm test
        npm run testnodeconsumer

    # Codecov Integration: Coverage Analytics + Test Analytics
    - name: MCP Tests with Coverage
      run: npm run test:coverage

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        flags: mcp-tests
        name: codecov-mcp-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload Test Results to Codecov
      uses: codecov/codecov-action@v7
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
        files: ./test-results/junit.xml
        flags: mcp-tests
        name: codecov-test-results
        fail_ci_if_error: false

    # NOTE: Web UI production build (npx grunt prod) removed in v1.7.1
    # This fork focuses on the MCP server implementation. The web UI files
    # (src/web/) and related build infrastructure were removed as they are
    # not needed for MCP server functionality. The production build step
    # required those deleted web UI files and would fail.
