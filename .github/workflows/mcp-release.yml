name: "Publish MCP Server Image"

on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  # The GHCR package name is MAJOR-VERSIONED and is derived from the tag, in the
  # "Resolve the GHCR package name" step below -- it is not fixed here.
  #
  # `_v1` is FROZEN from v2.0.0: its existing tags stay pullable, and the v1.9.x maintenance
  # branch keeps publishing security-only patches there until ~Mar 2027, under Apache-2.0. v2.x
  # publishes to `_v2`, which is GPL-3.0-or-later. Hard-coding `_v1` here would have pushed the
  # relicensed, breaking-change v2.0.0 image into the package promising the opposite of both.
  # Docker Hub image name (assumes username/repo format - update with your Docker Hub namespace)
  # Example: if your Docker Hub username is 'myusername', this becomes 'myusername/cyberchef-mcp'
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cyberchef-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      attestations: write  # Required for attestation generation
      id-token: write      # Required for OIDC token generation (attestation signing)

    steps:
      - name: Configure git
        run: git config --global init.defaultBranch master

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # =============================================================================
      # Authentication: Log in to both GHCR and Docker Hub
      # =============================================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =============================================================================
      # Metadata Extraction: Generate tags and labels for both registries
      # =============================================================================
      # =============================================================================
      # GHCR package name: cyberchef-mcp_v<MAJOR>, derived from the tag being built
      # =============================================================================
      - name: Resolve the GHCR package name
        id: ghcr-name
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          # workflow_dispatch has no tag, so fall back to the version the tree declares.
          if [[ "$ref" =~ ^v([0-9]+)\. ]]; then
            major="${BASH_REMATCH[1]}"
          else
            major="$(node -p "require('./package.json').mcpVersion.split('.')[0]")"
            echo "::notice::no v<major> tag on '$ref'; using mcpVersion major $major"
          fi
          case "$major" in
            ''|*[!0-9]*) echo "::error::could not resolve a numeric major from '$ref'"; exit 1 ;;
          esac
          echo "name=${GITHUB_REPOSITORY_OWNER}/cyberchef-mcp_v${major}" >> "$GITHUB_OUTPUT"
          echo "Publishing to GHCR package cyberchef-mcp_v${major}"

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ steps.ghcr-name.outputs.name }}
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # =============================================================================
      # Build and Push: Single build, multi-registry push with attestations
      # =============================================================================
      # CRITICAL: Supply chain attestations for Docker Scout health score compliance
      # Docker Hub health scores require BOTH provenance and SBOM attestations.
      # These attestations account for 15 points out of 100 in the health score.
      # Missing attestations can drop the score from A to C grade.
      #
      # Dual SBOM Strategy:
      # 1. Docker attestation SBOM (below): Attached to image manifest for
      #    Docker Scout health scores, `docker sbom` command, and registry verification
      # 2. Trivy SBOM artifact (separate step): Downloadable CycloneDX file
      #    for offline audits, compliance reports, and third-party tools
      #
      # References:
      # - Docker Scout Policies: https://docs.docker.com/scout/policy/
      # - Health Scores: https://docs.docker.com/scout/policy/scores/
      # - GitHub Actions Attestations: https://docs.docker.com/build/ci/github-actions/attestations/
      # =============================================================================
      - name: Build and push Docker image to both registries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          platforms: linux/amd64
          # Supply chain attestations (CRITICAL for Docker Hub health score)
          provenance: mode=max  # Max-level provenance for SLSA Build Level 3 compliance
          sbom: true            # Generate and attach SBOM attestation (in-toto SPDX format)
          # Note: Attestations are automatically pushed with the image to both registries

      # =============================================================================
      # Export: Create tarball for offline distribution
      # =============================================================================
      # Note: We pull from Docker Hub since that's the primary distribution channel
      - name: Pull Docker image from Docker Hub for export
        run: |
          docker pull "$DOCKERHUB_REGISTRY/$DOCKERHUB_IMAGE_NAME:latest"

      - name: Export Docker image as tarball
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          docker save "$DOCKERHUB_REGISTRY/$DOCKERHUB_IMAGE_NAME:latest" | gzip > "cyberchef-mcp-${TAG_NAME}-docker-image.tar.gz"
          ls -lh cyberchef-mcp-*.tar.gz

      # =============================================================================
      # Security: Generate SBOM and Vulnerability Scans
      # =============================================================================
      # Generate Software Bill of Materials (SBOM) - Part 2 of Dual Strategy
      # This Trivy-generated SBOM complements the Docker attestation SBOM above
      # Purpose: Provides CycloneDX format for:
      # - Offline security audits (no registry access required)
      # - Third-party SBOM analysis tools (Dependency-Track, Grype, etc.)
      # - Compliance documentation (SOC 2, ISO 27001, NIST SSDF)
      # - Manual verification and archival
      - name: Generate SBOM with Trivy (CycloneDX artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}:latest'
          format: 'cyclonedx'
          output: 'sbom.cyclonedx.json'
          vuln-type: 'os,library'

      # Security: Run vulnerability scan on release image (scanning Docker Hub image)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}:latest'
          format: 'sarif'
          output: 'trivy-release-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-release-results.sarif'
          category: 'trivy-release-scan'

      # Create GitHub Release if it doesn't exist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Check if release exists, create if not.
          #
          # The notes come from docs/releases/<tag>.md when that file exists. They used to be the
          # single line "See CHANGELOG.md for details." -- which is not a link GitHub resolves on a
          # release page, and which threw away notes the repository had already written: v2.0.0 and
          # v2.1.0 both shipped with a one-line body while a 200-line release document sat in the
          # tree. Prior releases had 154-449 line bodies, so this was a silent regression in the
          # release ceremony rather than a deliberate choice.
          #
          # Falling back rather than failing: a hotfix tag cut without a release document should
          # still publish, and the fallback now points at a URL that actually resolves.
          NOTES_FILE="docs/releases/${TAG_NAME}.md"
          if ! gh release view "$TAG_NAME" &>/dev/null; then
            echo "Creating release for $TAG_NAME"
            if [ -f "$NOTES_FILE" ]; then
              echo "Using release notes from $NOTES_FILE"
              gh release create "$TAG_NAME" \
                --title "Release $TAG_NAME" \
                --notes-file "$NOTES_FILE" \
                --verify-tag
            else
              echo "::warning::$NOTES_FILE not found; publishing with a link to the changelog"
              gh release create "$TAG_NAME" \
                --title "Release $TAG_NAME" \
                --notes "Release notes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)" \
                --verify-tag
            fi
          else
            echo "Release $TAG_NAME already exists"
          fi

      # =============================================================================
      # Docker Hub description: synced from the repository, so it cannot drift
      # =============================================================================
      # It is NOT generated from the README -- Docker Hub has no such mechanism -- so before this
      # step it was edited by hand and went stale silently: it advertised v1.4.6 while 1.9.0 was
      # current, claimed Node 22 for an image running Node 25, said "463 operations" when there
      # were 504, and carried ~101 relative links that resolve to nothing off GitHub.
      #
      # docs/registry/dockerhub-description.md is the source, and every link in it is absolute.
      - name: Sync the Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE_NAME: ${{ env.DOCKERHUB_IMAGE_NAME }}
        run: |
          set -euo pipefail
          DESC_FILE="docs/registry/dockerhub-description.md"
          if [ ! -f "$DESC_FILE" ]; then
            echo "::warning::$DESC_FILE not found; leaving the Docker Hub description as it is"
            exit 0
          fi

          # A JWT from username+token. The description endpoint does not accept the token directly.
          jwt="$(curl -sS -X POST https://hub.docker.com/v2/users/login \
                   -H 'Content-Type: application/json' \
                   -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                          '{username:$u,password:$p}')" | jq -r '.token // empty')"
          if [ -z "$jwt" ]; then
            echo "::warning::could not authenticate to Docker Hub; skipping the description sync"
            exit 0
          fi

          code="$(jq -n --rawfile full "$DESC_FILE" \
                    --arg short "MCP server exposing all 504 GCHQ CyberChef operations as AI tools" \
                    '{full_description:$full, description:$short}' \
                  | curl -sS -o /dev/null -w '%{http_code}' \
                      -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE_NAME}/" \
                      -H "Authorization: JWT ${jwt}" \
                      -H 'Content-Type: application/json' --data @-)"
          if [ "$code" = "200" ]; then
            echo "Docker Hub description updated from $DESC_FILE"
          else
            # Not fatal: the image is already published, and a stale description must not fail a
            # release that otherwise succeeded.
            echo "::warning::Docker Hub description update returned HTTP $code"
          fi

      - name: Attach tarball to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" "cyberchef-mcp-${TAG_NAME}-docker-image.tar.gz" --clobber

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" sbom.cyclonedx.json --clobber