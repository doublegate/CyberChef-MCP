name: "Benchmark Baseline (runner)"

# WHY THIS EXISTS
#
# The regression gate ships at a 50% tolerance, and 50% is a stopgap rather than a judgement. The
# baseline was captured on a developer machine; the gate RUNS on a GitHub runner. Measured across
# three runs, that runner produced deltas from -25.5% to +99.1% against the same baseline and two
# false failures at the 25% tolerance the local variance supported (v3.2.0 findings log F-13).
#
# Comparing like with like is the fix. This captures the baseline where the gate runs, so the
# tolerance can come back down to something the measurement supports rather than something wide
# enough to survive the mismatch.
#
# Manual and scheduled, never on push: a baseline that regenerates itself on every commit is not a
# baseline, it is a moving target that can never report a regression.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the baseline is being regenerated (goes in the PR body)"
        required: true
        type: string
  schedule:
    # Monthly. Runner hardware changes under you -- the point is to notice that it has, not to
    # track it continuously.
    - cron: "0 5 1 * *"

# Read-only at the workflow level. The write-scoped token lives on ONE job that installs nothing
# and runs no project code -- see `open-pr` below.
permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    # No write scope here. This job runs `npm ci` and then executes benchmark code, which is the
    # largest blast radius in the workflow: a compromised dependency or script would otherwise sit
    # in the same job as a token that can push to the default branch and open pull requests.
    # `performance-benchmarks.yml` already splits its capture and reporting jobs for the same
    # reason; this follows it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate OperationConfig
        run: npx grunt configTests

      # Five runs, first discarded. Same method as the local capture, for the same reason: the
      # first bench of a cold process absorbs JIT warm-up and a baseline built from it is one that
      # every later run beats.
      - name: Capture
        run: node benchmarks/capture-baseline.mjs

      - name: Show what changed
        run: git --no-pager diff --stat benchmarks/baseline.json

      - name: Hand the baseline to the PR job
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-baseline
          path: benchmarks/baseline.json
          retention-days: 7

  # The only job with a write-scoped token. It installs nothing, runs no project code, and touches
  # exactly one file -- so a compromised dependency in the job above cannot reach this token.
  # PUSHES A BRANCH; DOES NOT OPEN THE PULL REQUEST.
  #
  # It used to call `peter-evans/create-pull-request`, and the first time this workflow was ever
  # run -- in v3.4.0, months after it was written -- that step failed:
  #
  #     ##[error]GitHub Actions is not permitted to create or approve pull requests.
  #
  # Confirmed at the source: `can_approve_pull_request_reviews` is false on this repository, which
  # is the same setting, and `upstream-sync.yml` and `upstream-monitor.yml` had already hit it.
  #
  # The setting is not flipped to make this work. That checkbox grants Actions the right to APPROVE
  # pull requests as well as open them, which is a review bypass, and this workflow's whole purpose
  # is to keep a gate's reference point under review.
  #
  # Nothing of value is lost, because the PR was never the safety property. The property is that
  # this **never pushes to master**: the baseline moves only when a person merges the branch. The
  # branch is pushed, the summary below links straight to the compare view, and the last step is
  # one click instead of zero.
  open-pr:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Take the captured baseline
        uses: actions/download-artifact@v8
        with:
          name: benchmark-baseline
          path: benchmarks/

      - name: Push the baseline to a branch
        id: push
        env:
          REASON: ${{ inputs.reason || 'Scheduled monthly recapture.' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- benchmarks/baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The captured baseline is identical to the committed one. Nothing to review."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch the target branch FIRST. `--force-with-lease` compares against the local
          # remote-tracking ref, and `actions/checkout` fetches only the default branch -- so on
          # every run after the first, when the branch already exists, the push would be rejected
          # with `stale info` for want of a lease value rather than for any real conflict. The
          # `|| true` covers the first run, where the branch does not exist yet.
          git fetch origin chore/benchmark-baseline || true
          git checkout -b chore/benchmark-baseline
          git add benchmarks/baseline.json
          git commit -m "chore(benchmarks): recapture the baseline on the runner" -m "$REASON" -m \
            "Captured by .github/workflows/benchmark-baseline.yml on the same runner class the regression gate executes on, so the comparison is like against like."
          # --force-with-lease over a plain --force: a stale local ref must not silently discard a
          # capture someone else pushed while this one was running.
          git push --force-with-lease origin chore/benchmark-baseline

      - name: Say what to do with it
        env:
          REASON: ${{ inputs.reason || 'Scheduled monthly recapture.' }}
        run: |
          {
            if [ "${{ steps.push.outputs.changed }}" != "true" ]; then
              echo "### Baseline unchanged"
              echo
              echo "The runner captured the same numbers as the committed baseline. No branch pushed."
              exit 0
            fi
            echo "### A recaptured baseline is waiting on \`chore/benchmark-baseline\`"
            echo
            echo "**Reason:** $REASON"
            echo
            echo "[Open the pull request](${{ github.server_url }}/${{ github.repository }}/compare/chore/benchmark-baseline?expand=1)"
            echo
            echo "Read the diff before merging. A baseline that moves without a stated reason is a"
            echo "gate switched off, and it looks identical to one moved for a good reason — which is"
            echo "why this stops at a branch rather than pushing to master."
            echo
            echo "The tolerance in \`baseline.json\` stays at 50%. v3.4.0 tried 20% on a study of"
            echo "three runner captures and CI disproved it the same day -- the pool varies by"
            echo "~40% on memory-bound tasks. See docs/internal/measurements/v3.4.0-runner-baseline.md;"
            echo "the fix is a calibration task or a median of runs, not a different number."
            echo "See \`docs/internal/v3.4.0-findings-log.md\` F-01 and F-02."
          } >> "$GITHUB_STEP_SUMMARY"
