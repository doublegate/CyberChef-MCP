name: Performance Benchmarks

on:
  push:
    branches: [master]
    paths:
      - 'src/node/mcp-server.mjs'
      - 'src/node/index.mjs'
      - 'src/core/**'
      - 'benchmarks/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/node/mcp-server.mjs'
      - 'src/node/index.mjs'
      - 'src/core/**'
      - 'benchmarks/**'
  workflow_dispatch:

# Default for every job: read only. The write scope needed to post a comment is granted to the
# `report` job alone, and ONLY that job -- see the note on its `permissions:` block.
permissions:
  contents: read

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure git
        run: git config --global init.defaultBranch master

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update browserslist database
        run: npx update-browserslist-db@latest

      - name: Generate OperationConfig
        run: npx grunt configTests

      - name: Run benchmarks
        run: |
          # `set -o pipefail` is NOT redundant here. GitHub's default shell for `run:` is
          # `bash -e {0}` -- confirmed from this repository's own run logs -- and pipefail is
          # added only when a step explicitly sets `shell: bash`. Without this line, `tee`
          # would mask a failing `npm run benchmark` and the job would go green on a failure.
          set -o pipefail
          # NO_COLOR/FORCE_COLOR: the output goes into a markdown code block, where ANSI
          # escapes render as literal `\x1b[32m` noise rather than colour.
          NO_COLOR=1 FORCE_COLOR=0 npm run benchmark 2>&1 | tee benchmark-output.txt

      # Hand the output to the reporting job as an artifact. `if: always()` so a FAILING
      # benchmark still gets reported -- the output of a failure is the most useful comment
      # this workflow can post, and it was previously discarded.
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-output
          path: benchmark-output.txt
          retention-days: 7
          if-no-files-found: warn

  # Separate job, and the separation is the point. The job above installs the PR's dependencies
  # (`npm ci`, with lifecycle scripts) and executes the PR's own code. Holding a write-scoped
  # token in that job would put it within reach of anything that code or its dependency tree
  # does -- flagged by CodeRabbit and by zizmor as `excessive-permissions` (CWE-732).
  #
  # This job never checks out the repository and never runs project code. It downloads one text
  # file and posts it. That is the only place `pull-requests: write` exists.
  report:
    name: Report benchmark results
    needs: benchmark
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Posting a comment on a pull request. PRs are issues, but GitHub scopes PR comments to
      # `pull-requests`, not `issues` -- see the permissions table in the Actions docs.
      pull-requests: write
    steps:
      - name: Download benchmark output
        uses: actions/download-artifact@v6
        with:
          name: benchmark-output
        continue-on-error: true

      # Reporting must never fail the workflow. Before this split, a 403 in the comment step
      # turned a fully green benchmark run into a red check and blocked unrelated PRs.
      - name: Comment benchmark results on PR
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            // `require` is injected by github-script as a proxy wrapper and works for node
            // builtins. It is resolved INSIDE the try rather than at the top of the script
            // because v8/v9 moved this action to ESM and made `require('@actions/github')`
            // fail; the builtin case still works, but a reporting step must not die on the
            // question. If it ever does stop working, the comment degrades to a placeholder
            // instead of throwing.
            //
            // Carry the actual numbers. The previous body said only "Benchmarks have been run
            // ... check the workflow logs", spending an API call and a PR comment to report
            // that a thing had happened.
            let output;
            try {
              const fs = require("fs");
              output = fs.readFileSync("benchmark-output.txt", "utf8").trim();
            } catch (err) {
              // Logged, not swallowed: if the artifact is missing, the reason belongs in the
              // job log rather than being replaced silently by a placeholder.
              console.error("Could not read benchmark-output.txt:", err.message);
              output = "(benchmark output was not captured -- see the workflow logs)";
            }

            // GitHub rejects bodies over 65536 characters. Keep the TAIL, since these
            // benchmarks print their summary last.
            const LIMIT = 60000;
            let truncated = false;
            if (output.length > LIMIT) {
              output = output.slice(-LIMIT);
              // `slice` cuts UTF-16 code units, so the boundary can land inside a surrogate
              // pair and leave a lone half. Drop it rather than emit a broken character.
              output = output.replace(/^[\uDC00-\uDFFF]/, "");
              truncated = true;
            }

            // A fence longer than any backtick run in the content, so benchmark output that
            // itself contains ``` cannot break out of the code block.
            const longest = (output.match(/`+/g) || []).reduce((n, s) => Math.max(n, s.length), 0);
            const fence = "`".repeat(Math.max(3, longest + 1));

            const body = [
              "## Performance Benchmark Results",
              "",
              `Benchmark job: **${{ needs.benchmark.result }}**`,
              "",
              ...(truncated ? ["_Output truncated to the last 60,000 characters._", ""] : []),
              "<details><summary>Full benchmark output</summary>",
              "",
              fence,
              output,
              fence,
              "",
              "</details>",
              "",
              "> No baseline comparison is performed yet, so these numbers are informational and",
              "> this check cannot fail on a regression. Automated regression detection is tracked",
              "> for the v2.0.0 release work.",
            ].join("\n");

            // `await`: without it a rejection became an unhandled rejection that took the job
            // down with an opaque stack instead of a readable error.
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
