name: Performance Benchmarks

on:
  push:
    branches: [master]
    paths:
      - 'src/node/mcp-server.mjs'
      - 'src/node/index.mjs'
      - 'src/core/**'
      - 'benchmarks/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/node/mcp-server.mjs'
      - 'src/node/index.mjs'
      - 'src/core/**'
      - 'benchmarks/**'
  workflow_dispatch:

# GITHUB_TOKEN defaults to read-only in this repository, so the "comment results" step
# below 403s with "Resource not accessible by integration" -- which failed the whole
# workflow on every PR. Least privilege: read the code, write one PR comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure git
        run: git config --global init.defaultBranch master

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update browserslist database
        run: npx update-browserslist-db@latest

      - name: Generate OperationConfig
        run: npx grunt configTests

      - name: Run benchmarks
        id: bench
        run: |
          set -o pipefail
          npm run benchmark 2>&1 | tee benchmark-output.txt

      # `continue-on-error`: this step REPORTS, it does not gate. Previously a failure to post
      # a comment failed the whole workflow, so a permissions problem in the reporting path
      # showed up as a red "Run Performance Benchmarks" check even though every benchmark had
      # passed. A build gate should fail on the build, never on its own commentary.
      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            // Carry the actual numbers. The previous body said only "Benchmarks have been run
            // ... check the workflow logs", which is a notification that a thing happened
            // rather than a result -- it cost an API call and a comment to convey nothing.
            let output = "";
            try {
              output = fs.readFileSync("benchmark-output.txt", "utf8").trim();
            } catch {
              output = "(benchmark output was not captured)";
            }

            // GitHub rejects comment bodies over 65536 characters. Keep the TAIL, since these
            // benchmarks print their summary last.
            const LIMIT = 60000;
            let truncated = false;
            if (output.length > LIMIT) {
              output = output.slice(-LIMIT);
              truncated = true;
            }

            const body = [
              "## Performance Benchmark Results",
              "",
              truncated ? "_Output truncated to the last 60,000 characters._\n" : "",
              "<details><summary>Full benchmark output</summary>",
              "",
              "```",
              output,
              "```",
              "",
              "</details>",
              "",
              "> No baseline comparison is performed yet, so these numbers are informational and",
              "> this check cannot fail on a regression. Automated regression detection is tracked",
              "> for the v2.0.0 release work.",
            ].join("\n");

            // `await` matters: without it a rejected promise became an unhandled rejection that
            // took the job down with an opaque stack instead of a readable failure.
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
