# Antigravity PR Review -- copy this file (and the scripts/ dir) into any repo.
# Runs a Gemini review on a self-hosted runner using your `agy` OAuth session,
# so it draws on your Google AI Ultra limits instead of a paid API key.
#
# Requires a self-hosted runner registered with the label `agy` on a machine
# where `agy` is logged in. See ../../README.md for the full setup.
name: Antigravity PR Review

on:
  pull_request:
    # `synchronize` auto-re-reviews on every push to a same-repo PR. It is safe
    # under the default-branch checkout below: the reviewer always runs from the
    # default branch, and the PR only supplies the diff (data fed to agy), never
    # the reviewer code.
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # SECURITY GATE (a self-hosted runner on a PUBLIC repo executes on real hardware
    # and spends the owner's Google AI Ultra quota, so "who can start a run" is the
    # primary control):
    #  - pull_request: only from a branch in THIS repo. A FORK PR must never schedule
    #    work on the self-hosted host. GitHub's "require approval for outside
    #    collaborators" setting is belt-and-suspenders, not the gate — its default only
    #    covers *first-time* contributors, so a returning outside contributor would
    #    otherwise get a runner.
    #  - issue_comment: only `/agy-review`, and the association test below is a CHEAP
    #    PRE-FILTER, not the permission gate. `author_association` answers "what is this
    #    person's relationship to the repo", not "may they run code on my workstation":
    #    a Triage-only user reports as COLLABORATOR with no write access whatsoever.
    #    The real decision is `agy_has_write_access` in `scripts/agy-review.sh`, which
    #    asks the permissions API and fails closed. Keeping the coarse test here only
    #    avoids booting a runner for an obvious stranger; do not treat it as the gate.
    #    That script also re-checks fork status, because the `issue_comment` payload
    #    carries no head-repo field for the `if:` to gate on — a trusted commenter is
    #    not the same as a trusted diff.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/agy-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Concurrency at the JOB level (NOT workflow level): a job skipped by the `if:`
    # above never enters the group, so an unrelated `issue_comment` on the PR (e.g.
    # another review bot commenting) can't cancel an in-progress review. And
    # cancel-in-progress:false means a second *real* review queues behind the first
    # instead of killing it. Fixes the race where any comment on the PR aborted the
    # running review mid-`agy`.
    concurrency:
      group: agy-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: [self-hosted, agy]
    # Bounded harder than the hosted jobs, not softer: this runs on the
    # maintainer's own hardware, so a hung run holds a real machine rather than
    # a disposable VM. Observed runtime is 1-3 minutes.
    timeout-minutes: 30
    steps:
      # Check out the DEFAULT BRANCH, never the PR head. This job runs the checked-out
      # `scripts/agy-review.sh` on a self-hosted runner with a token in the environment,
      # so taking those scripts from the PR would let the reviewed change rewrite its own
      # reviewer. The review content is unaffected: the diff comes from `gh pr diff` (or,
      # for a diff over GitHub's 20,000-line API limit, from a local `git diff` of fetched
      # objects) — never from the checked-out working tree, which stays on the default
      # branch throughout. Consequence worth knowing: a PR that edits the reviewer or the
      # style guide is reviewed by the version already on the default branch until it merges.
      - name: Check out repo (for the style guide + scripts)
        # SHA-pinned, not `@v7`: this job runs on a SELF-HOSTED runner -- the
        # maintainer's own machine -- so a compromised tag would execute there
        # rather than in a disposable VM. Verified to be exactly what `v7`
        # resolves to (v7.0.1, 2026-07-17). The trailing `# v7` is the form
        # Dependabot's github-actions ecosystem reads to keep the pin current.
        # Adopted FROM RustySNES and SLAC, which had it while the template did not.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Not `fetch-depth: 0`: the large-diff fallback fetches exactly the two refs it
          # needs on demand, so a full history clone would be paid on every run for a path
          # most runs never take.
          fetch-depth: 1
          # No checkout should persist credentials: agy executes with the repo as its
          # workspace, so a token left in .git/config would be reachable by anything the
          # review runs. The large-diff fallback still performs an authenticated fetch, but
          # supplies the token per command via `http.extraheader` rather than persisting it.
          persist-credentials: false

      # BOOTSTRAP ONLY. On the very first install in a repo the scripts exist on the PR
      # branch but not yet on the default branch, so the run step below chmods files that
      # are not there and the job dies before it can review anything. Observed on
      # CyberChef-MCP PR #41, and predicted by Copilot review on that same PR.
      #
      # This step checks out and then EXECUTES code from the PR head on a self-hosted runner,
      # which is normally the thing you must never do. Three properties are what make it
      # defensible here, and all three must hold — if you are editing this step, they are the
      # invariant, not the YAML:
      #
      #  1. It fires only when the default branch has no reviewer at all (`hashFiles` empty),
      #     i.e. exactly once in a repository's life, and never again after that PR merges.
      #  2. The head must be a branch in THIS repository, so a fork PR can never reach it.
      #  3. The PR author must hold write access AT RUN TIME, verified against the permissions
      #     API by the step below — not inferred from `author_association`, and not merely
      #     implied by their having been able to push the branch at some point in the past.
      #     This is what closes the revoked-collaborator gap: a stale branch pushed by someone
      #     whose access was later removed no longer bootstraps.
      #
      # Worth stating plainly, because it is what bounds the exposure: `pull_request` runs the
      # workflow definition from the PR branch. Anyone who can satisfy (2) and (3) can already
      # rewrite THIS FILE on their branch and have it execute on the runner. The bootstrap
      # therefore grants no capability that the event type has not already granted to the same
      # set of people. It is not a reason to relax any of the three conditions.
      - name: Check bootstrap author still has write access
        id: agy_bootstrap_auth
        if: >-
          hashFiles('scripts/agy-review.sh') == '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          # Fails closed: an API error, an unknown login, or any role below `write` leaves
          # `writer` unset, and the checkout below does not run.
          #
          # The failure REASON is surfaced, not swallowed. Denying silently makes "this person
          # has no write access" (intended, one PR affected) indistinguishable from "the token
          # lost its scope" (the bootstrap is dead for everyone) — an outage that reads as a
          # decision. Redacted first: this log is public.
          if perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${PR_AUTHOR}/permission" \
                       --jq '.permission // empty' 2>perm_err.txt)"; then
            :
          else
            reason="$(tr '\n' ' ' < perm_err.txt \
                        | sed -E 's/(gh[pousr]|github_pat)_[A-Za-z0-9_]+/<redacted-token>/g' \
                        | cut -c1-300)"
            echo "::warning::Reviewer bootstrap permission lookup failed for ${PR_AUTHOR}: ${reason}"
            perm=""
          fi
          rm -f perm_err.txt
          case "$perm" in
            admin|maintain|write)
              echo "writer=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::Skipping reviewer bootstrap: ${PR_AUTHOR} has permission '${perm:-none}', write required." ;;
          esac

      - name: Bootstrap reviewer from PR head (first install only)
        id: agy_bootstrap
        if: steps.agy_bootstrap_auth.outputs.writer == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .agy-bootstrap

      - name: Install bootstrapped reviewer
        if: steps.agy_bootstrap.outcome == 'success'
        run: |
          set -eu
          echo "::notice::Default branch has no reviewer yet; bootstrapping from the PR head."
          mkdir -p scripts
          cp .agy-bootstrap/scripts/agy-review.sh \
             .agy-bootstrap/scripts/_agy_print.sh \
             .agy-bootstrap/scripts/_agy_comment_body.sh scripts/
          # The style guide is read from the workspace too, and is equally absent on a first install.
          if [ -f .agy-bootstrap/.github/agy-review.md ] && [ ! -f .github/agy-review.md ]; then
            mkdir -p .github && cp .agy-bootstrap/.github/agy-review.md .github/
          fi
          rm -rf .agy-bootstrap

      - name: Run Antigravity review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- optional overrides (uncomment to change) ---
          # AGY_MODEL: gemini-3-pro        # default: agy's configured model
          AGY_EFFORT: high                 # low|medium|high
          # AGY_DIFF_MODE: auto            # auto|inline|file — how the diff reaches agy. `auto`
          #                                # (default) inlines a small diff and hands a large one to
          #                                # agy as a file, so PR size never truncates the review.
          # MAX_DIFF_BYTES: "5000000"      # sanity cap on a pathological diff (5 MB). Do NOT lower
          #                                # this to bound the review: it truncates the diff BEFORE the
          #                                # file handoff, so a low value defeats the large-PR path.
          # MAX_PROMPT_BYTES: "125000"     # inline/file threshold + hard backstop on the argv prompt
          # STYLE_GUIDE: .github/agy-review.md   # style guide, loaded if present
        run: |
          # The workflow and the scripts come from DIFFERENT REFS: for a `pull_request`
          # event GitHub runs this YAML from the PR branch, while the checkout step
          # above deliberately fetches the DEFAULT branch to get the scripts. So a
          # change that adds a script file breaks its own PR -- the new workflow
          # chmods a file the default branch does not have yet. Observed exactly
          # once, on the PR that introduced `_agy_comment_body.sh`.
          #
          # The two required files are chmod'd unconditionally; anything added later
          # is chmod'd only if present, so the workflow stays compatible with both
          # the old and the new script set. A genuinely missing required file still
          # fails loudly -- `agy-review.sh` sources it and dies -- rather than being
          # papered over here.
          chmod +x scripts/agy-review.sh scripts/_agy_print.sh
          for opt in scripts/_agy_comment_body.sh; do
            [ -f "$opt" ] && chmod +x "$opt"
          done
          true
          scripts/agy-review.sh
